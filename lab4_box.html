<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Element</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; }
        section { padding: 10px; }
        div { float: left; padding: 18px; margin-right: 4px; }
        .div1 { background: #e74c3c; color: white; }
        .div2 { background: #f1c40f; }
        .div3 { background: #27ae60; color: white; }
        .div4 { background: #3498db; color: white; clear: left; float: none; margin-top: 8px; }
    </style>
</head>
<body>
    <header><h1>Box Element dan CSS Float</h1></header>
    <section>
        <div class="div1">Div 1</div>
        <div class="div2">Div 2</div>
        <div class="div3">Div 3</div>
        <div class="div4">Div 4 — menggunakan clear: left</div>
    </section>
</body>
</html>
